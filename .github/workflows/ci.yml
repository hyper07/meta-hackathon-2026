name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: app/uv.lock
      - name: Install (CPU-only torch on Linux, from the lock)
        run: uv sync --frozen
      - name: Run the 77 tests (speech is faked; no keys, no network calls)
        run: uv run python -m pytest -q

  device:
    name: Charm bridge tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Framing, CRC and audio chunks of the USB link (device/bridge.py)
        run: uvx pytest -q tests

  mobile:
    name: Phone app type-check and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint (expo lint)
        run: npm run lint

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t watchme .
