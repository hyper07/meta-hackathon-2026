name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: app/uv.lock
      - name: Install (CPU-only torch on Linux, from the lock)
        run: uv sync --frozen
      - name: Run the 32 tests (speech is faked; no keys, no network calls)
        run: uv run python -m pytest -q

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t watchme .
