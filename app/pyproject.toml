[project]
name = "watchme"
version = "0.1.0"
description = "Watch Me: a voice-started safety companion with a team of agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "faster-whisper>=1.0",
    "transformers>=4.44",
    "torch>=2.3",
    "soundfile>=0.12",
    "speechbrain>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
scenarios = [
    "kokoro>=0.9",
    "sentencepiece>=0.2.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
